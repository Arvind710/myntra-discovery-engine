[pytest]
testpaths = evals
markers =
    phase0: P0 gate -- foundation, schema, codebook freeze, credentials
    phase1: P1 gate -- collection, cleaning, Data Bank (S1-*)
    phase2: P2 gate -- relevance, classification, clustering (S2-*)
    phase3: P3 gate -- insights and hypotheses (S3-*)
    phase4: P4 gate -- chatbot (S4-*)
    phase5: P5 gate -- release, cross-cutting (X-*)
    needs_corpus: requires a populated corpus.db
    needs_api: makes a live API call
addopts = -q --strict-markers
