  - C10
  statement: 'Pre-registered barrier hypothesis. Approval & permission. The unresolved question is: I
    need to check with my partner/parent. The decision requires ANOTHER PERSON — spousal/parental approval,
    budget permission, or social validation before committing. Distinct from C3 (the user''s own uncertainty
    about fit-to-self) and from C5 (choosing between options). The blocker is an external dependency.
    People work around it by: sharing the link; group polls; waiting for a reply.'
