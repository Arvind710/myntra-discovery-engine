  statement: 'Pre-registered barrier hypothesis. No trigger to return. The unresolved question is: What
    would bring the user back to the list?. Forgetting the LIST EXISTS. If the user remembers the list
    but has no reason to act TODAY on a specific item, that is C13. If they remember and cannot find the
    item inside the list, that is B1.x. A1.1 is failure to return at all. No search, filter, or sort within
    wishlist. The unresolved question is: Can the user find a specific saved item?. Cannot locate a REMEMBERED
    item inside the list. If the user cannot remember WHY they saved it, that is B3.1. If they cannot
    find the list itself, that is A2.1. Reverse-chronological only. The unresolved question is: Does old
    intent stay reachable?. Specifically about ORDERING burying older saves. B1.1 is the absence of a
    retrieval tool; B1.2 is a wrong default order. Out-of-stock items clutter the list. The unresolved
    question is: Is the list still mostly alive?. CRITICAL BOUNDARY vs C8. B2.1 is out-of-stock items
    degrading the LIST as a browsing surface — a clutter and hygiene problem. C8 is the user wanting a
    SPECIFIC item and its size not being purchasable at the moment of decision. B2.1 is solvable without
    money (hide, group, or flag dead items); C8 is supply-side and fails C-2. If the text is about the
    list looking dead, code B2.1; if it is about not being able to buy the one thing they came for, code
    C8.'
  stages:
  - A
  - B
- id: H2
  codes:
  - C5
  statement: 'Pre-registered barrier hypothesis. Comparison paralysis / shortlist commitment. The unresolved
    question is: Which of these five do I actually pick?. Blocked by CHOICE AMONG ALTERNATIVES, not by
    doubt about any single item. Requires evidence of multiple candidates. If the user is comparing the
    same item ACROSS RETAILERS on price, that is C6; across retailers for evidence, that is C14. People
    work around it by: opening multiple tabs; screenshot collages; deferring.'
  stages:
