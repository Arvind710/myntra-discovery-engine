- id: H4
  codes:
  - C3
  statement: 'Pre-registered barrier hypothesis. Styling & self-image / wardrobe integration. The unresolved
    question is: Will it look good on *me*, with what I own?. Doubt about the item ON THIS PERSON or WITH
    THIS WARDROBE — body type, skin tone, "what would I wear it with", occasion-appropriateness. C1/C2
    are doubts about the GARMENT; C3 is a doubt about the MATCH between garment and self. If the user
    wants someone else''s approval, that is C10. ALSO C3: a stated DECISION RULE about wardrobe fit or
    versatility - "if I cannot make four outfits from what I already own, it goes", "only worth it if
    I can repeat it for work and going out", "does this earn its place". These read as general shopping
    philosophy but they are exactly the wardrobe-integration test being applied, and they are the strongest
    C3 evidence in the corpus because the user is stating the criterion rather than merely failing it.
    Do NOT send these to Z-99. People work around it by: screenshotting to compare with wardrobe; Pinterest
    checks.'
  stages:
  - C
- id: H5
  codes:
  - C4
  - C14
  statement: 'Pre-registered barrier hypothesis. Real-buyer evidence insufficient. The unresolved question
    is: What did people who actually received it say?. ON-PLATFORM review evidence is thin, stale, photo-less,
    or untrusted. A CONTENT problem. C14 is the RETENTION problem that follows when the user leaves to
    find that evidence elsewhere. Same trigger, opposite solves — this split closes gap 3 in problemstatement.md
    §5.7. If the text describes wanting better reviews, code C4; if it describes going to YouTube/Reddit/Instagram
    to look, code C14 (and usually both). People work around it by: reading reviews for on-body photos;
    sizing comments; complaint patterns. Off-platform verification exit. The unresolved question is: Let
    me go check this properly somewhere else. The user LEAVES THE PLATFORM to verify, and the session
    dies. The strongest workaround evidence in the corpus — a user who builds this much effort is proving
    the unmet need without being asked. If they left and bought elsewhere, C11 is the outcome and C14
    the blocking cause. If they wanted better on-platform evidence but did not leave, that is C4 alone.
    People work around it by: YouTube unboxings; Reddit threads; Instagram; price comparison sites.'
  stages:
  - C
- id: H6
  codes:
  - C1
  - C2
  statement: 'Pre-registered barrier hypothesis. Fit & size uncertainty. The unresolved question is: Which
    size, when every brand runs different?. Doubt about WHICH SIZE TO PICK, while the item is purchasable.
    Brand- to-brand inconsistency, unreliable size charts, "will it fit me". IF THE SIZE IS SIMPLY NOT
    PURCHASABLE, THAT IS C8 — different phase, opposite solve, and the single most consequential confusion
    in this codebook (EC-CLS-12). If the doubt is about fabric, drape, colour accuracy or quality rather
    than measurement, that is C2. If the user forgot which size they had chosen at save time, that is
    B3.2. People work around it by: ordering two sizes; checking a garment they own; abandoning. Physical-vs-digital
    gap (material & quality). The unresolved question is: Will the fabric, colour and quality match the
    photos?. Doubt about the PHYSICAL PROPERTIES of the garment versus its depiction: fabric feel, sheerness,
    colour accuracy, stitching, "will it look cheap". C1 is measurement; C2 is material. If the user wants
    OTHER BUYERS'' evidence to resolve it, that is C4 — C2 is the doubt, C4 is the missing evidence to
    settle it. Multi-label where both hold. People work around it by: zooming images; hunting buyer photos;
    asking in comments.'
  stages:
  - C
- id: H7
  codes:
  - C6
  statement: 'Pre-registered barrier hypothesis. Value & price uncertainty. The unresolved question is:
    Is this the right price, and is now the right time?. C-2 CRITICAL. Includes price-fairness doubt,
    "is this worth it", waiting for a sale, suspicion that the discount is fake, and cross-platform price
    comparison. It does NOT include cost revealed LATE at checkout (shipping, fees, COD charge) — that
    is D1, an information-timing problem with a clean non-monetary fix. It does not include affordability
    alone with no doubt about value. When resolving a price complaint, ask whether the non-monetary component
    is TRANSPARENCY (price history, honest anchoring) or TIMING (when to buy) — record that in reasoning,
    because "users want it cheaper" is an unusable finding under C-2. People work around it by: cross-platform
    price checks; waiting on sale calendars.'
  stages:
  - C
- id: H8
  codes:
  - C7
  statement: 'Pre-registered barrier hypothesis. Fulfilment & returns trust (risk floor). The unresolved
    question is: If it''s wrong, how painful is sending it back?. Anticipated RETURN/EXCHANGE EFFORT or
    delivery risk suppressing the decision BEFORE purchase. A past bad experience cited as a reason for
    PRESENT hesitation belongs here (this is the EC-REL-1 boundary that makes the record relevant at all).
    A complaint about a return that already happened, with no bearing on a current decision, is NOT relevant
    and must not reach classification. People work around it by: reading the return policy; preferring
    COD; buying in-store.'
