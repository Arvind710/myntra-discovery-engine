- id: DH12
  codes:
  - C13
  statement: 'Pre-registered barrier hypothesis. No trigger to act now. The unresolved question is: What
    makes today different from tomorrow?. No doubt remains and nothing is blocking — there is simply no
    reason to act TODAY. Closes gap 2 in problemstatement.md §5.7; the only hypothesis the blueprint marks
    as spanning two stages, cross-linked to A1.2. Code C13 only when the record shows resolved-but-unacted
    intent. If an unresolved doubt is present, code that doubt instead. If the user is waiting for a SPECIFIC
    named event (sale, salary, restock), that is C6 or C8 with segment S2, not C13. People work around
    it by: indefinite deferral; waiting for an unnamed prompt.'
  stages:
  - C
- id: DH13
  codes:
  - D1
  - D2
  statement: 'Pre-registered barrier hypothesis. Cost surprise. The unresolved question is: Why is the
    total higher than the price?. Cost revealed LATE: shipping, platform/convenience fee, COD charge,
    tax. The complaint is about TIMING AND DISCLOSURE, not the item''s price. Doubt about the ITEM''s
    price at the decision stage is C6. This distinction matters under C-2: D1 has a clean non-monetary
    fix (disclose earlier), C6 mostly does not. Mechanical friction. The unresolved question is: Did the
    transaction physically complete?. Payment failure, no preferred payment method, OTP drop, pincode
    rejected at checkout. A MECHANICAL failure, not a decision. Generic app crashes unrelated to completing
    a purchase are out of scope at the relevance pass. If the user chose not to pay, that is D4, not D2.'
  stages:
  - D
